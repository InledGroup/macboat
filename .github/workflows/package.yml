name: Build and Package

# This workflow builds and packages the application for Debian, RPM, and Arch Linux.
# Este flujo de trabajo compila y empaqueta la aplicación para Debian, RPM y Arch Linux.

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  get-version:
    # Run if manual dispatch, or tag push, or branch push containing [RELEASE] in the commit message
    # Ejecutar si es ejecución manual, push de etiqueta o push en rama con [RELEASE] en el mensaje del commit
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.event.head_commit != null && contains(github.event.head_commit.message, '[RELEASE]'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        # Extract the version from meson.build
        # Extraer la versión de meson.build
        run: |
          VERSION=$(python3 -c "import re; content = open('meson.build').read(); print(re.search(r\"version:\s*'([^']+)'\", content).group(1))")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build-deb:
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 debhelper devscripts libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev
      - name: Fix permissions
        run: chmod +x build-aux/meson_post_install.py
      - name: Prepare changelog
        # Create changelog with the clean version from meson.build
        # Crear changelog con la versión limpia obtenida de meson.build
        run: |
          mkdir -p debian
          VERSION_CLEAN="${{ needs.get-version.outputs.version }}"
          echo "macboat ($VERSION_CLEAN) unstable; urgency=medium" > debian/changelog
          echo "  * New release" >> debian/changelog
          echo " -- InledGroup <hi@inled.es>  $(date -R)" >> debian/changelog
      - name: Build deb
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../macboat_*.deb dist/
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    needs: get-version
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y meson ninja-build python3-devel gtk4-devel libadwaita-devel webkitgtk6.0-devel rpm-build tar
      - name: Fix permissions
        run: chmod +x build-aux/meson_post_install.py
      - name: Build RPM
        # Compile RPM package with the version from meson.build
        # Compilar paquete RPM con la versión de meson.build
        run: |
          VERSION_CLEAN="${{ needs.get-version.outputs.version }}"
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          tar --transform "s,^,macboat-${VERSION_CLEAN}/," --exclude=.git -czf ~/rpmbuild/SOURCES/macboat-${VERSION_CLEAN}.tar.gz .
          cp rpm/macboat.spec ~/rpmbuild/SPECS/
          sed -i "s/Version:        0.1.0/Version:        ${VERSION_CLEAN}/" ~/rpmbuild/SPECS/macboat.spec
          rpmbuild -ba --nodeps ~/rpmbuild/SPECS/macboat.spec
          cp ~/rpmbuild/RPMS/*/*.rpm .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: ./*.rpm

  build-arch:
    needs: get-version
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm meson ninja python python-gobject gtk4 libadwaita webkitgtk-6.0 base-devel git sudo
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builduser .
      - name: Fix permissions
        run: chmod +x build-aux/meson_post_install.py
      - name: Build Arch Package
        # Build Arch package with the version from meson.build
        # Construir paquete de Arch con la versión de meson.build
        run: |
          VERSION_CLEAN="${{ needs.get-version.outputs.version }}"
          tar -czf "/tmp/macboat-${VERSION_CLEAN}.tar.gz" --exclude=arch --exclude=.git --transform "s,^,macboat-${VERSION_CLEAN}/," .
          mv "/tmp/macboat-${VERSION_CLEAN}.tar.gz" arch/
          cd arch
          sed -i "s/pkgver=0.1.0/pkgver=${VERSION_CLEAN}/" PKGBUILD
          sed -i '/sha256sums=/c\sha256sums=("SKIP")' PKGBUILD
          chown builduser:builduser macboat-${VERSION_CLEAN}.tar.gz PKGBUILD
          su builduser -c "makepkg --noconfirm -s --nocheck"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: arch/*.pkg.tar.zst

  publish-release:
    needs: [get-version, build-deb, build-rpm, build-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-packages
          merge-multiple: true
      - name: Upload to GitHub Release
        # Create GitHub Release and upload package assets
        # Crear la Release en GitHub y subir los paquetes compilados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ needs.get-version.outputs.version }}"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Release $TAG_NAME"
          fi
          gh release upload "$TAG_NAME" all-packages/* --clobber
      - name: Notify Inled Repo
        # Send dispatch event to update repositories
        # Enviar evento de despacho para actualizar los repositorios
        run: |
          VERSION_CLEAN="${{ needs.get-version.outputs.version }}"
          BASE_URL="https://github.com/InledGroup/macboat/releases/download/v${VERSION_CLEAN}"
          
          # 1. Debian
          DEB_URL="${BASE_URL}/macboat_${VERSION_CLEAN}_amd64.deb"
          curl -X POST -H "Accept: application/vnd.github.v3+json" \
               -H "Content-Type: application/json" \
               -H "Authorization: token ${{ secrets.INLED_REPO_PAT }}" \
               https://api.github.com/repos/InledGroup/apt/dispatches \
               -d "{\"event_type\": \"package_upload\", \"client_payload\": {\"package_url\": \"$DEB_URL\", \"type\": \"deb\"}}"
          
          # 2. RPM
          # Note: Fedora versions in CI might produce different dist tags, usually .fc40 or similar.
          # We use a wildcard approach or specific knowledge. Based on logs it was .fc44.
          RPM_FILE=$(ls all-packages/*.rpm | head -n 1 | xargs basename)
          RPM_URL="${BASE_URL}/${RPM_FILE}"
          curl -X POST -H "Accept: application/vnd.github.v3+json" \
               -H "Content-Type: application/json" \
               -H "Authorization: token ${{ secrets.INLED_REPO_PAT }}" \
               https://api.github.com/repos/InledGroup/apt/dispatches \
               -d "{\"event_type\": \"package_upload\", \"client_payload\": {\"package_url\": \"$RPM_URL\", \"type\": \"rpm\"}}"
          
          # 3. Arch
          ARCH_FILE=$(ls all-packages/*.pkg.tar.zst | head -n 1 | xargs basename)
          ARCH_URL="${BASE_URL}/${ARCH_FILE}"
          curl -X POST -H "Accept: application/vnd.github.v3+json" \
               -H "Content-Type: application/json" \
               -H "Authorization: token ${{ secrets.INLED_REPO_PAT }}" \
               https://api.github.com/repos/InledGroup/apt/dispatches \
               -d "{\"event_type\": \"package_upload\", \"client_payload\": {\"package_url\": \"$ARCH_URL\", \"type\": \"arch\"}}"
