name: Build and Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 debhelper devscripts libgtk-4-dev libadwaita-1-dev
      - name: Prepare changelog
        run: |
          mkdir -p debian
          echo "macboat (${GITHUB_REF_NAME#v}) unstable; urgency=medium" > debian/changelog
          echo "  * New release" >> debian/changelog
          echo " -- Jaime <jaime@example.com>  $(date -R)" >> debian/changelog
      - name: Build deb
        run: dpkg-buildpackage -us -uc -b
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ../macboat_*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: dnf install -y meson ninja-build python3-devel gtk4-devel libadwaita-devel rpm-build tar
      - name: Build RPM
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          tar --transform "s,^,macboat-${VERSION}/," -czf ~/rpmbuild/SOURCES/macboat-${VERSION}.tar.gz .
          cp rpm/macboat.spec ~/rpmbuild/SPECS/
          sed -i "s/Version:        0.1.0/Version:        ${VERSION}/" ~/rpmbuild/SPECS/macboat.spec
          rpmbuild -ba ~/rpmbuild/SPECS/macboat.spec
          cp ~/rpmbuild/RPMS/*/*.rpm .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: ./*.rpm

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm meson ninja python gtk4 libadwaita base-devel git
          useradd -m builduser
          chown -R builduser .
      - name: Build Arch Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd arch
          sed -i "s/pkgver=0.1.0/pkgver=${VERSION}/" PKGBUILD
          # Use local source for CI
          sed -i 's|source=(.*)|source=("macboat::git+file://'${GITHUB_WORKSPACE}'")|' PKGBUILD
          su builduser -c "makepkg --noconfirm -s"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: arch/*.pkg.tar.zst

  notify-inled:
    needs: [build-deb, build-rpm, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Notify Inled Repo
        run: |
          # Note: We use the .deb URL for the notification as per documentation example.
          # The central repo will handle finding other formats if needed or we can expand this.
          PACKAGE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/macboat_${{ github.ref_name#v }}_amd64.deb"
          curl -X POST -H "Accept: application/vnd.github.v3+json" \
               -H "Authorization: token ${{ secrets.INLED_REPO_PAT }}" \
               https://api.github.com/repos/inled-group/aptrepo/dispatches \
               -d "{\"event_type\": \"package_upload\", \"client_payload\": {\"package_url\": \"$PACKAGE_URL\"}}"
