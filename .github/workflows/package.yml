name: Build and Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 debhelper devscripts libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev
      - name: Fix permissions
        run: chmod +x build-aux/meson_post_install.py
      - name: Prepare changelog
        run: |
          mkdir -p debian
          VERSION_CLEAN=${GITHUB_REF_NAME#v}
          echo "macboat ($VERSION_CLEAN) unstable; urgency=medium" > debian/changelog
          echo "  * New release" >> debian/changelog
          echo " -- InledGroup <hi@inled.es>  $(date -R)" >> debian/changelog
      - name: Build deb
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../macboat_*.deb dist/
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y meson ninja-build python3-devel gtk4-devel libadwaita-devel webkitgtk6.0-devel rpm-build tar
      - name: Fix permissions
        run: chmod +x build-aux/meson_post_install.py
      - name: Build RPM
        run: |
          VERSION_CLEAN=${GITHUB_REF_NAME#v}
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          tar --transform "s,^,macboat-${VERSION_CLEAN}/," --exclude=.git -czf ~/rpmbuild/SOURCES/macboat-${VERSION_CLEAN}.tar.gz .
          cp rpm/macboat.spec ~/rpmbuild/SPECS/
          sed -i "s/Version:        0.1.0/Version:        ${VERSION_CLEAN}/" ~/rpmbuild/SPECS/macboat.spec
          rpmbuild -ba --nodeps ~/rpmbuild/SPECS/macboat.spec
          cp ~/rpmbuild/RPMS/*/*.rpm .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: ./*.rpm

  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm meson ninja python python-gobject gtk4 libadwaita webkitgtk-6.0 base-devel git sudo
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builduser .
      - name: Fix permissions
        run: chmod +x build-aux/meson_post_install.py
      - name: Build Arch Package
        run: |
          VERSION_CLEAN=${GITHUB_REF_NAME#v}
          # Create a source tarball for makepkg to use locally, outside of the source tree to avoid "file changed as we read it"
          tar -czf "/tmp/macboat-${VERSION_CLEAN}.tar.gz" --exclude=arch --exclude=.git --transform "s,^,macboat-${VERSION_CLEAN}/," .
          mv "/tmp/macboat-${VERSION_CLEAN}.tar.gz" arch/
          
          cd arch
          sed -i "s/pkgver=0.1.0/pkgver=${VERSION_CLEAN}/" PKGBUILD
          sed -i '/sha256sums=/c\sha256sums=("SKIP")' PKGBUILD
          
          # Build as builduser
          chown builduser:builduser macboat-${VERSION_CLEAN}.tar.gz PKGBUILD
          su builduser -c "makepkg --noconfirm -s --nocheck"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: arch/*.pkg.tar.zst

  notify-inled:
    needs: [build-deb, build-rpm, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Notify Inled Repo
        run: |
          VERSION_CLEAN=${GITHUB_REF_NAME#v}
          PACKAGE_URL="https://github.com/InledGroup/macboat/releases/download/${{ github.ref_name }}/macboat_${VERSION_CLEAN}_amd64.deb"
          curl -X POST -H "Accept: application/vnd.github.v3+json" \
               -H "Authorization: token ${{ secrets.INLED_REPO_PAT }}" \
               https://api.github.com/repos/InledGroup/apt/dispatches \
               -d "{\"event_type\": \"package_upload\", \"client_payload\": {\"package_url\": \"$PACKAGE_URL\"}}"
